name: Coletar views dos CPLs

on:
  schedule:
    # 4 tentativas por hora, fora do minuto 0 (o GitHub atrasa/descarta muito no minuto 0).
    # O robo ignora as seguintes se a hora ja foi coletada. Repositorio publico = minutos ilimitados.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:        # permite rodar na mao pelo botao do GitHub

permissions:
  contents: write           # deixa o robo salvar o historico de volta no repositorio
  actions: write            # deixa o robo se religar (o GitHub desliga apos 60 dias sem commit)

concurrency:
  group: coletar-cpl
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v5

      - name: Preparar o Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Instalar o login do Google (usuario-robo dos leads)
        run: pip install --quiet google-auth requests


      - name: Rodar o robo
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
        run: python robo.py

      - name: Salvar o historico
        run: |
          git config user.name "robo-cpl"
          git config user.email "robo-cpl@users.noreply.github.com"
          git add dados/snapshots.csv
          if git diff --staged --quiet; then
            echo "Nada novo pra salvar."
          else
            git commit -m "Coleta automatica $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - name: Manter o robo ligado
        # o GitHub desliga rotina de repositorio parado ha 60 dias; religar a cada execucao zera o prazo
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/coletar.yml/enable"

      - name: Avisar no Telegram se falhar
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=🚨 ROBÔ DOS CPLs FALHOU — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
